<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Anime Watch Together Ultimate</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0f172a; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* تثبيت الفيديو في الأعلى ومنعه من التأثر بالكيبورد */
    .video-container { flex-shrink: 0; width: 100%; background: #000; position: relative; }
    video { width: 100%; max-height: 40vh; display: block; }

    /* الجزء السفلي المتروك للشات والسجل والحالة */
    .content-area { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }

    /* شريط حالة النشاط */
    .status-bar { display: flex; gap: 10px; align-items: center; background: #1e293b; padding: 8px; border-radius: 6px; font-size: 0.85rem; }
    .user-dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; display: inline-block; }

    /* إدخال النصوص والأزرار */
    .input-group { display: flex; gap: 6px; }
    input { flex: 1; padding: 8px 10px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 0.85rem; outline: none; }
    button { padding: 8px 14px; background: #6366f1; border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
    button:hover { background: #4f46e5; }

    /* سجل الروابط */
    .history-box { background: #1e293b; border-radius: 6px; padding: 8px; font-size: 0.8rem; }
    .history-title { font-weight: bold; margin-bottom: 5px; color: #94a3b8; }
    .history-item { padding: 5px; background: #0f172a; border-radius: 4px; margin-bottom: 4px; cursor: pointer; word-break: break-all; }
    .history-item:hover { background: #334155; }

    /* الدردشة */
    .chat-box { flex: 1; min-height: 120px; background: #1e293b; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; }
    #messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; }
    .msg-item { word-break: break-word; }
    .msg-name { font-weight: bold; color: #818cf8; margin-left: 4px; }
  </style>
</head>
<body>

  <!-- 1. فيديو ثابت في الأعلى -->
  <div class="video-container">
    <video id="videoPlayer" controls>
      <source src="" type="video/mp4">
      متصفحك لا يدعم تشغيل الفيديو.
    </video>
  </div>

  <div class="content-area">
    <!-- 2. حالة النشاط (Online) -->
    <div class="status-bar" id="usersStatus"></div>

    <!-- 3. إدخال الاسم ورابط الفيديو المباشر -->
    <div class="input-group">
      <input type="text" id="username" placeholder="اسمكِ..." />
      <input type="text" id="videoUrlInput" placeholder="الصقي رابط فيديو مباشر (MP4)..." />
      <button onclick="changeVideo()">تشغيل</button>
    </div>

    <!-- 4. سجل الروابط -->
    <div class="history-box">
      <div class="history-title">سجل الروابط السابقة:</div>
      <div id="historyList">لا يوجد روابط مسجلة بعد</div>
    </div>

    <!-- 5. الشات والإرسال -->
    <div class="chat-box">
      <div id="messages"></div>
    </div>
    <div class="input-group">
      <input type="text" id="messageInput" placeholder="اكتبي رسالة..." onkeypress="if(event.key==='Enter') sendMessage()" />
      <button onclick="sendMessage()">إرسال</button>
    </div>
  </div>

  <script>
    // إعدادات Firebase الخاصة بمشروعكِ
    const firebaseConfig = {
      apiKey: "AIzaSyAs57mg-SUx-QFeYsqky4SIvph71n5uB5w",
      authDomain: "with-somy.firebaseapp.com",
      databaseURL: "https://with-somy-default-rtdb.firebaseio.com",
      projectId: "with-somy",
      storageBucket: "with-somy.firebasestorage.app",
      messagingSenderId: "925753610772",
      appId: "1:925753610772:web:1c1c7784d6f5c686d4d01"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const video = document.getElementById('videoPlayer');

    // --- (أ) حفظ واسترجاع اسم المستخدم محلياً ---
    const usernameInput = document.getElementById('username');
    const savedName = localStorage.getItem('chatUsername') || "Alien";
    usernameInput.value = savedName;
    usernameInput.addEventListener('change', () => {
      localStorage.setItem('chatUsername', usernameInput.value.trim());
      updatePresence();
    });

    // --- (ب) حالة النشاط الحية (Presence) ---
    let myPresenceRef = null;
    function updatePresence() {
      const currentName = usernameInput.value.trim() || "Alien";
      if (!myPresenceRef) {
        myPresenceRef = db.ref('onlineUsers').push();
        myPresenceRef.onDisconnect().remove();
      }
      myPresenceRef.set({ name: currentName, online: true });
    }
    updatePresence();

    db.ref('onlineUsers').on('value', (snapshot) => {
      const container = document.getElementById('usersStatus');
      container.innerHTML = "<strong>الموجودون الآن:</strong> ";
      snapshot.forEach((child) => {
        const u = child.val();
        container.innerHTML += `<span style="display:inline-flex; align-items:center; gap:4px; margin-right:8px;"><span class="user-dot"></span>${u.name}</span>`;
      });
    });

    // --- (ج) تغيير الفيديو والمزامنة اللحظية ---
    let isRemoteChange = false; // منع تكرار إرسال الأحداث عند استقبالها

    function changeVideo() {
      const url = document.getElementById('videoUrlInput').value.trim();
      if (url) {
        db.ref('videoState').set({ src: url, action: 'load', time: 0 });
        db.ref('history').push({ url: url, timestamp: Date.now() });
      }
    }

    // إرسال الأحداث عند تفاعل المستخدم مع المشغل
    video.onplay = () => {
      if (!isRemoteChange) db.ref('videoState').update({ action: 'play', time: video.currentTime });
    };
    video.onpause = () => {
      if (!isRemoteChange) db.ref('videoState').update({ action: 'pause', time: video.currentTime });
    };
    video.onseeking = () => {
      if (!isRemoteChange) db.ref('videoState').update({ time: video.currentTime });
    };

    // استقبال الأحداث وتنفيذها عند الطرفين
    db.ref('videoState').on('value', (snapshot) => {
      const state = snapshot.val();
      if (!state) return;

      isRemoteChange = true;

      if (state.action === 'load' && video.src !== state.src) {
        video.src = state.src;
      }

      if (Math.abs(video.currentTime - state.time) > 1.5) {
        video.currentTime = state.time;
      }

      if (state.action === 'play' && video.paused) {
        video.play().catch(() => {});
      } else if (state.action === 'pause' && !video.paused) {
        video.pause();
      }

      setTimeout(() => { isRemoteChange = false; }, 300);
    });

    // --- (د) سجل الروابط ---
    db.ref('history').limitToLast(5).on('value', (snapshot) => {
      const historyDiv = document.getElementById('historyList');
      historyDiv.innerHTML = "";
      snapshot.forEach((child) => {
        const item = child.val();
        historyDiv.innerHTML += `
          <div class="history-item" onclick="playFromHistory('${item.url}')">
            ▶ ${item.url}
          </div>
        `;
      });
    });

    function playFromHistory(url) {
      db.ref('videoState').set({ src: url, action: 'load', time: 0 });
    }

    // --- (هـ) الشات والمراسلة ---
    function sendMessage() {
      const name = usernameInput.value.trim() || "Alien";
      const msgInput = document.getElementById('messageInput');
      const text = msgInput.value.trim();

      if (text !== "") {
        db.ref('chat').push({ name: name, text: text, time: Date.now() });
        msgInput.value = "";
      }
    }

    db.ref('chat').limitToLast(20).on('value', (snapshot) => {
      const messagesDiv = document.getElementById('messages');
      messagesDiv.innerHTML = "";
      snapshot.forEach((child) => {
        const data = child.val();
        messagesDiv.innerHTML += `
          <div class="msg-item">
            <span class="msg-name">${data.name}:</span>
            <span>${data.text}</span>
          </div>
        `;
      });
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });
  </script>
</body>
</html>
