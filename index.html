<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Anime Watch Together - Pro Max</title>
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>

  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

  <style>
    :root {
      --bg-main: #070b14; --bg-content: #0b1120; --bg-panel: #1e293b; --bg-hover: #334155; --text-main: #f8fafc; --text-muted: #94a3b8; --accent: #6366f1; --accent-hover: #4f46e5;
    }
    body.theme-pink { --bg-main: #fdf2f8; --bg-content: #fce7f3; --bg-panel: #fbcfe8; --bg-hover: #f9a8d4; --text-main: #1e293b; --text-muted: #475569; --accent: #ec4899; --accent-hover: #be185d; }
    body.theme-blue { --bg-main: #f0f9ff; --bg-content: #e0f2fe; --bg-panel: #bae6fd; --bg-hover: #7dd3fc; --text-main: #0f172a; --text-muted: #334155; --accent: #0284c7; --accent-hover: #0369a1; }
    body.theme-cozy { --bg-main: #1c1917; --bg-content: #292524; --bg-panel: #44403c; --bg-hover: #57534e; --text-main: #fafaf9; --text-muted: #a8a29e; --accent: #d97706; --accent-hover: #b45309; }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: var(--bg-content); } ::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 10px; }

    /* تثبيت البودي لمنع المتصفح من العبث بالارتفاع الكلي */
    body { background: var(--bg-main); color: var(--text-main); height: 100%; position: fixed; width: 100%; overflow: hidden; display: flex; flex-direction: column; transition: 0.3s; }

    /* جعل الفيديو مقدساً وارتفاعه ثابت لا ينضغط أبداً */
    .video-container { width: 100%; flex: 0 0 40vh; background: #000; z-index: 100; border-bottom: 3px solid var(--accent); }
    .video-js { width: 100%; height: 100%; } .vjs-default-skin .vjs-control-bar { background: rgba(0,0,0,0.8); } .video-js .vjs-play-progress { background-color: var(--accent); }    

    /* جعل منطقة المحتوى تأخذ المساحة المتبقية فقط، والشات بداخلها يتمدد */
    .content-area { flex: 1; display: flex; flex-direction: column; padding: 12px; gap: 8px; overflow-y: auto; background: var(--bg-content); transition: 0.3s; }    

    /* أزرار السلايد الأنيقة */
    details { background: var(--bg-panel); border-radius: 10px; border: 1px solid var(--bg-hover); margin-bottom: 2px; }
    summary { padding: 10px 12px; font-size: 0.85rem; font-weight: bold; cursor: pointer; color: var(--accent); list-style: none; display: flex; justify-content: space-between; align-items: center; }
    summary::-webkit-details-marker { display: none; }
    .details-content { padding: 10px; border-top: 1px solid var(--bg-hover); display: flex; flex-direction: column; gap: 8px; }

    .status-bar { display: flex; gap: 10px; align-items: center; background: var(--bg-panel); padding: 8px 12px; border-radius: 10px; font-size: 0.85rem; overflow-x: auto; border: 1px solid var(--bg-hover); white-space: nowrap; }
    .user-badge { display: flex; align-items: center; gap: 6px; background: var(--bg-content); padding: 4px 12px; border-radius: 20px; border: 1px solid var(--bg-hover); }
    .user-avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; background: var(--bg-hover); }
    .user-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e; animation: pulse 2s infinite; }
    .kick-btn { margin-right: auto; padding-right: 8px; color: #ef4444; cursor: pointer; background: none; border: none; font-size: 0.9rem; font-weight: bold; }
    
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

    .input-group { display: flex; gap: 8px; }
    input[type="text"] { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--bg-hover); background: var(--bg-panel); color: var(--text-main); font-size: 0.9rem; outline: none; }
    input[type="text"]:focus { border-color: var(--accent); }
    button { padding: 10px 16px; background: var(--accent); border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; font-size: 0.85rem; transition: 0.2s; white-space: nowrap; }
    button:hover { background: var(--accent-hover); transform: translateY(-1px); }
    button.icon-btn { padding: 8px 12px; font-size: 1.1rem; background: var(--bg-hover); }

    .history-item { background: var(--bg-content); border-radius: 6px; padding: 5px 8px; cursor: pointer; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; font-size: 0.8rem; margin-bottom: 4px; border: 1px solid transparent; }
    .history-item:hover { border-color: var(--accent); color: var(--accent); }

    .chat-container { flex: 1; display: flex; flex-direction: column; background: var(--bg-panel); border-radius: 10px; padding: 12px; overflow: hidden; border: 1px solid var(--bg-hover); min-height: 250px; }
    #messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 10px; }
    .msg-item { display: flex; align-items: flex-start; gap: 10px; font-size: 0.9rem; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .msg-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
    .msg-content { background: var(--bg-content); padding: 8px 12px; border-radius: 10px; border-top-right-radius: 2px; max-width: 85%; word-break: break-word; border: 1px solid var(--bg-hover); }
    .msg-content.mine { background: var(--accent); border-color: var(--accent-hover); border-top-right-radius: 10px; border-top-left-radius: 2px; color: #fff; }
    .msg-name { font-weight: bold; color: var(--accent); font-size: 0.75rem; display: block; margin-bottom: 4px; }
    .msg-content.mine .msg-name { color: #e0e7ff; }
    .chat-img { max-width: 160px; border-radius: 8px; margin-top: 4px; cursor: pointer; display: block; }
    .chat-sticker { max-width: 90px; margin-top: 4px; cursor: pointer; display: block; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3)); }
    .msg-content.sticker-bg { background: transparent !important; border: none !important; padding: 0 !important; box-shadow: none !important; }
    
    .msg-system { text-align: center; font-size: 0.8rem; color: var(--text-muted); font-style: italic; margin: 4px 0; }
    .typing-indicator { font-size: 0.8rem; color: var(--accent); font-style: italic; min-height: 20px; margin-top: 4px; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal-card { background: var(--bg-panel); width: 100%; max-width: 350px; border-radius: 16px; padding: 24px; text-align: center; display: flex; flex-direction: column; gap: 16px; border: 1px solid var(--bg-hover); }
    .avatar-picker { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin: 10px 0; align-items: center; }
    .avatar-opt { width: 50px; height: 50px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; object-fit: cover; background: var(--bg-content); transition: 0.2s; }
    .avatar-opt.selected { border-color: var(--accent); transform: scale(1.15); box-shadow: 0 0 15px rgba(99, 102, 241, 0.5); }
  </style>

</head>
<body>

  <div id="profileModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <h2 style="color: #fff;">غرفة المشاهدة 🎬</h2>
      <p style="font-size:0.9rem; color:#94a3b8;">اختر صورتك الرمزية واسمك للدخول:</p>
      <div class="avatar-picker">
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Alien" class="avatar-opt selected" onclick="selectAvatar(this)" />
        <!-- فامب كيوت أنمي بلمسة حمراء -->
        <img src="https://api.dicebear.com/7.x/lorelei/svg?seed=VampireGirl&backgroundColor=fca5a5&hair=variant12" class="avatar-opt" onclick="selectAvatar(this)" title="Vamp" />
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Cat" class="avatar-opt" onclick="selectAvatar(this)" />
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Bandit" class="avatar-opt" onclick="selectAvatar(this)" />
        <!-- زر رفع صورة مخصصة من الاستوديو (لأجنحة الخفاش وأي تصميم خاص بكما) -->
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
          <label for="customAvatar" class="avatar-opt" style="display: flex; align-items: center; justify-content: center; font-size: 1.5rem; background: var(--bg-hover);" title="صورة من الاستوديو">➕</label>
          <input type="file" id="customAvatar" accept="image/*" style="display:none;" onchange="handleCustomAvatar(this)">
        </div>
      </div>
      <input type="text" id="initUsername" placeholder="اكتب اسمك هنا..." />
      <button onclick="saveProfile()" style="padding: 12px; font-size: 1rem;">دخول الغرفة</button>
    </div>
  </div>

  <!-- نافذة عرض الصور المصغرة بشكل شفاف وجميل (الطلب الثاني) -->
  <div id="imageModal" class="modal-overlay" style="display: none; z-index: 2000; flex-direction: column;" onclick="this.style.display='none'">
    <div style="background: rgba(255,255,255,0.05); padding: 10px; border-radius: 12px; max-width: 90%; max-height: 80vh; backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1);">
      <img id="expandedImg" src="" style="max-width: 100%; max-height: 70vh; border-radius: 8px; display: block;" />
    </div>
    <span style="color: #fff; margin-top: 10px; font-size: 0.9rem;">انقر في أي مكان للإغلاق</span>
  </div>

  <!-- لوحة الملصقات المحفوظة الدائمة (شبكة عمودية 4 أعمدة) -->
  <div id="stickersPanel" style="display: none; position: fixed; bottom: 80px; left: 12px; right: 12px; top: 45vh; background: var(--bg-panel); border: 1px solid var(--accent); border-radius: 12px; padding: 10px; z-index: 500; flex-direction: column; gap: 10px; box-shadow: 0 -5px 20px rgba(0,0,0,0.5);">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--bg-hover); padding-bottom: 5px;">
      <b style="color: var(--accent); font-size: 0.85rem;">الملصقات 🌟</b>
      <div style="display: flex; gap: 5px;">
        <button id="editStickersBtn" onclick="toggleEditStickers()" style="padding: 4px 8px; font-size: 0.75rem; background: #f59e0b;">✏️ تعديل</button>
        <input type="file" id="stickerUpload" accept="image/png, image/webp, image/gif" style="display:none;" onchange="uploadSticker(this)">
        <button onclick="document.getElementById('stickerUpload').click()" style="padding: 4px 8px; font-size: 0.75rem;">➕ رفع</button>
        <button onclick="toggleStickers()" style="padding: 4px 8px; font-size: 0.75rem; background: #ef4444;">✖</button>
      </div>
    </div>
    <div id="stickersContainer" style="display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; overflow-y: auto; padding-bottom: 5px; align-items: start; align-content: start;">
       <span style="font-size: 0.8rem; color: var(--text-muted); grid-column: span 8; text-align: center;">جاري تحميل الملصقات...</span>
    </div>
  </div>

  <div class="video-container">
    <video id="videoPlayer" class="video-js vjs-default-skin vjs-big-play-centered" controls playsinline muted preload="auto"></video>
  </div>

  <div class="content-area">
    <div class="status-bar" style="justify-content: space-between;">
      <div style="display:flex; gap:10px; align-items:center; overflow-x:auto; width: 100%;" id="usersStatus"><b>المتصلون:</b> جاري التحميل...</div>
      <button onclick="document.getElementById('profileModal').style.display='flex';" style="padding: 4px 8px; font-size: 0.75rem; background: #475569;">⚙️ تعديل</button>
    </div>
    
    <div class="status-bar" style="justify-content: space-between; font-size: 0.75rem; color: #a5b4fc; margin-top: -5px; margin-bottom: 5px;">
      <div id="syncStatus"><b>توقيت المشاهدة:</b> جاري التحميل...</div>
      <button onclick="document.getElementById('settingsModal').style.display='flex';" style="padding: 4px 8px; font-size: 0.75rem; background: var(--accent);">⚙️ إعدادات المشاهدة</button>
    </div>

  <!-- النافذة المنبثقة لإعدادات المشاهدة (الطلب الثالث) -->
  <div id="settingsModal" class="modal-overlay" style="display: none; z-index: 2000;" onclick="if(event.target===this) this.style.display='none'">
    <div class="modal-card" style="max-width: 90%; gap: 10px;" onclick="event.stopPropagation()">
      <h3 style="color: var(--accent); margin-bottom: 10px;">إعدادات المشاهدة ⚙️</h3>
      
      <div class="details-content" style="background: var(--bg-content); border-radius: 8px; text-align: right;">
        <b style="color: var(--text-main); font-size: 0.85rem;">📺 تشغيل رابط جديد:</b>
        <div class="input-group">
          <button onclick="openDrivePicker()" style="background: #2563eb; padding: 8px;">📁 Drive</button>
          <input type="text" id="videoUrlInput" placeholder="رابط MP4 مباشر..." style="padding: 8px;" />
          <button onclick="changeVideoManual()" style="padding: 8px;">تشغيل</button>
        </div>
      </div>

      <div class="details-content" style="background: var(--bg-content); border-radius: 8px; text-align: right;">
        <b style="color: var(--text-main); font-size: 0.85rem;">🎨 المظهر:</b>
        <div style="display: flex; gap: 5px; justify-content: center;">
          <button onclick="setTheme('default')" style="background: #0f172a; flex:1; padding: 6px;">داكن</button>
          <button onclick="setTheme('pink')" style="background: #ec4899; flex:1; padding: 6px;">وردي</button>
          <button onclick="setTheme('blue')" style="background: #0284c7; flex:1; padding: 6px;">سمائي</button>
          <button onclick="setTheme('cozy')" style="background: #d97706; flex:1; padding: 6px;">مريح</button>
        </div>
      </div>

      <div class="details-content" style="background: var(--bg-content); border-radius: 8px; text-align: right;">
         <b style="color: var(--text-main); font-size: 0.85rem;">🎬 سجل المشاهدة:</b>
         <div id="historyList" style="max-height: 80px; overflow-y: auto;">لا توجد مقاطع سابقة</div>
      </div>

      <button onclick="clearDatabase()" style="background: #ef4444; margin-top: 8px;">🗑️ مسح بيانات الشات والسجل</button>
      <button onclick="document.getElementById('settingsModal').style.display='none'" style="background: var(--bg-hover); margin-top: 5px;">إغلاق</button>
    </div>
  </div>

    <!-- 3. منطقة الشات وبداخلها زر إرسال الصور والملصقات بجانب حقل الكتابة -->
    <div class="chat-container">
      <div id="messages"></div>
      <div id="typingArea" class="typing-indicator"></div>
      <div class="input-group" style="margin-top: 8px;">
        <!-- 1. الزر الأول: لرفع صورة جديدة من الاستوديو (🖼️) -->
        <input type="file" id="imageUpload" accept="image/png, image/jpeg, image/webp" style="display:none;" onchange="sendImage(this)" />
        <button onclick="document.getElementById('imageUpload').click()" class="icon-btn" title="إرسال صورة">🖼️</button>
        
        <!-- 2. الزر الثاني (الجديد): لفتح لوحة الملصقات المحفوظة الدائمة (🌟) -->
        <button onclick="toggleStickers()" class="icon-btn" title="الملصقات المحفوظة">🌟</button>
        
        <!-- حقل الكتابة وزر الإرسال -->
        <input type="text" id="messageInput" placeholder="تحدث مع صديقتك..." oninput="handleTyping()" onkeypress="if(event.key==='Enter') sendMessage()" />
        <button onclick="sendMessage()">إرسال</button>
      </div>
    </div>
  </div>

  <script>
    // 1. إعدادات Firebase (استخدمت مفاتيحك الخاصة)
    const firebaseConfig = {
      apiKey: "AIzaSyAs57mg-SUx-QFeYsqky4SIvph71n5uB5w",
      authDomain: "with-somy.firebaseapp.com",
      databaseURL: "https://with-somy-default-rtdb.firebaseio.com",
      projectId: "with-somy",
      storageBucket: "with-somy.firebasestorage.app",
      messagingSenderId: "925753610772",
      appId: "1:925753610772:web:1c1c7784d6f5c686d4d01"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    // 2. تهيئة مشغل Video.js (البديل الأقوى)
    const player = videojs('videoPlayer', {
      userActions: { hotkeys: true }
    });

    // 3. إدارة المستخدم (البروفايل)
    let currentUser = JSON.parse(localStorage.getItem('app_user_profile')) || null;
        let userId = localStorage.getItem('app_user_id') || 'u_' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('app_user_id', userId);
    // تفعيل الثيمات
    const savedTheme = localStorage.getItem('app_theme') || 'default';
    setTheme(savedTheme);
    function setTheme(themeName) {
      document.body.className = themeName === 'default' ? '' : 'theme-' + themeName;
      localStorage.setItem('app_theme', themeName);
    }

    let selectedAvatarUrl = "https://api.dicebear.com/7.x/bottts/svg?seed=Alien";
    function selectAvatar(el) {
      document.querySelectorAll('.avatar-opt, label.avatar-opt').forEach(img => img.classList.remove('selected'));
      el.classList.add('selected');
      selectedAvatarUrl = el.src;
    }

    // معالجة الأفاتار من الاستوديو وتحويله لداتا
    function handleCustomAvatar(input) {
      const file = input.files[0];
      if(!file) return;
      if(file.size > 500000) { alert("حجم الصورة كبير جداً، اختر صورة أصغر للأفاتار."); return; }
      const reader = new FileReader();
      reader.onload = function(e) {
        selectedAvatarUrl = e.target.result;
        const label = input.previousElementSibling;
        label.innerHTML = `<img src="${selectedAvatarUrl}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
        document.querySelectorAll('.avatar-opt').forEach(img => img.classList.remove('selected'));
        label.classList.add('selected');
      };
      reader.readAsDataURL(file);
    }

    function saveProfile() {
      const name = document.getElementById('initUsername').value.trim() || "زائر";
      currentUser = { name: name, avatar: selectedAvatarUrl };
      localStorage.setItem('app_user_profile', JSON.stringify(currentUser));
      document.getElementById('profileModal').style.display = 'none';
      initPresence();
      sendSystemMessage(`دخل(ت) ${currentUser.name} إلى الغرفة 👋`);
    }    

    if (!currentUser) {
      document.getElementById('profileModal').style.display = 'flex';
    } else {
      initPresence();
      sendSystemMessage(`دخل(ت) ${currentUser.name} إلى الغرفة 👋`);
    }

    // 4. نظام المتواجدين الآن (Presence)
    function initPresence() {
      if(!currentUser) return;
      
      // استخدمنا userId الثابت بدلاً من push()
      const userRef = db.ref('onlineUsers/' + userId);
      
      userRef.onDisconnect().remove();
      userRef.set({ name: currentUser.name, avatar: currentUser.avatar });

      db.ref('onlineUsers').on('value', (snap) => {
        const bar = document.getElementById('usersStatus');
        bar.innerHTML = "<b>المتصلون:</b> ";
        let count = 0;
        snap.forEach(child => {
          count++;
          const u = child.val();
          bar.innerHTML += `
            <div class="user-badge" title="${u.name}">
              <span class="user-dot"></span>
              <img src="${u.avatar}" class="user-avatar" />
              <span>${u.name}</span>
              <button class="kick-btn" onclick="kickUser('${child.key}')" title="طرد هذا المستخدم">✖</button>
            </div>
          `;
        });
        if(count === 0) bar.innerHTML += "<span>لا يوجد أحد</span>";
      });
    }

    // دالة طرد المستخدمين المعلقين
    function kickUser(kId) {
      if(confirm("هل أنت متأكد من طرد هذا المستخدم؟")) {
        db.ref('onlineUsers/' + kId).remove();
        db.ref('typing/' + kId).remove(); // يحل مشكلة زائر يكتب الآن
        db.ref('playbackPositions/' + kId).remove();
      }
    }

    // متتبع توقيت المشاهدة الحي (تحديث كل ثانيتين)
    setInterval(() => {
      if(currentUser && !player.paused()) {
        const posRef = db.ref(`playbackPositions/${userId}`);
        posRef.set({ name: currentUser.name, time: player.currentTime() });
        posRef.onDisconnect().remove();
      }
    }, 2000);

    // استقبال التوقيت وعرضه
    db.ref('playbackPositions').on('value', (snap) => {
      const syncBar = document.getElementById('syncStatus');
      if(!syncBar) return;
      let html = "<b>التوقيت:</b> ";
      let count = 0;
      snap.forEach(c => {
        const d = c.val();
        if(d.name) {
          const m = Math.floor(d.time / 60);
          const s = Math.floor(d.time % 60).toString().padStart(2, '0');
          html += `<span style="margin-left: 12px; color: #f8fafc;">${d.name}: <span style="color:#22c55e;">${m}:${s}</span></span>`;
          count++;
        }
      });
      if(count === 0) html += "<span style='margin-left: 12px;'>متوقف</span>";
      syncBar.innerHTML = html;
    });

    // ==========================================
    // 5. قلب النظام: المزامنة الاحترافية للفيديو
    // ==========================================
    let isSystemAction = false; // هذا المتغير السحري يمنع التكرار اللانهائي
    const SYNC_THRESHOLD = 1.0; // فارق الثواني المسموح به قبل الإجبار على المزامنة

    function changeVideoManual() {
      const url = document.getElementById('videoUrlInput').value.trim();
      if (!url) return;
      
      const videoData = { src: url, action: 'load', time: 0, timestamp: Date.now(), sender: currentUser.name };
      db.ref('videoState').set(videoData);
      db.ref('history').push({ url: url, time: Date.now(), sender: currentUser.name });
      sendSystemMessage(`${currentUser.name} قام بتغيير مقطع الفيديو 🎬`);
      document.getElementById('videoUrlInput').value = "";
    }

        // --- أحداث المشغل (ترسل إلى Firebase) ---
    player.on('play', () => {
      if (isSystemAction) return; 
      db.ref('videoState').update({ action: 'play', time: player.currentTime(), timestamp: Date.now(), sender: currentUser.name });
      sendSystemMessage(`${currentUser.name} قام بتشغيل الفيديو ▶️`);
    });

    player.on('pause', () => {
      if (isSystemAction) return;
      db.ref('videoState').update({ action: 'pause', time: player.currentTime(), timestamp: Date.now(), sender: currentUser.name });
      sendSystemMessage(`${currentUser.name} أوقف الفيديو ⏸️`);
    });

    player.on('seeked', () => {
      if (isSystemAction) return;
      db.ref('videoState').update({ time: player.currentTime(), timestamp: Date.now(), sender: currentUser.name });
      sendSystemMessage(`${currentUser.name} قام بتقديم/تأخير الفيديو ⏩`);
    });

    // --- استقبال الأوامر من Firebase ---
    db.ref('videoState').on('value', (snap) => {
      const st = snap.val();
      if (!st) return;

      // 1. تحميل مقطع جديد (مُحصّن لمتصفحات الموبايل)
      if (st.action === 'load' && window.currentLoadedUrl !== st.src) {
        window.currentLoadedUrl = st.src;
        isSystemAction = true;
        
        // إيقاف المشغل وتفريغ المصدر القديم لتفادي تعارض الذاكرة
        player.pause();
        player.reset();

        // نمرر الرابط كـ src مباشر بدون تحديد النوع لنجعل المتصفح يكتشفه بمرونة
        player.src(st.src);

        // ننتظر حتى يصبح المشغل مستعداً تماماً لقراءة البيانات (أهم خطوة للموبايل)
        player.ready(function() {
            setTimeout(() => {
                // محاولة التشغيل مع معالجة خطأ سياسات المتصفح بصمت
                player.play().catch(error => {
                    console.log("متصفح الموبايل يحتاج لتفاعل يدوي لبدء التشغيل");
                });
                isSystemAction = false;
            }, 1000);
        });
        return;
      }

      // 2. حساب التأخير الزمني للإنترنت
      const now = Date.now();
      const delayInSeconds = st.timestamp ? (now - st.timestamp) / 1000 : 0;
      let expectedTime = st.time;
      if (st.action === 'play') { expectedTime += delayInSeconds; }

      // 3. المزامنة المتسامحة (منع التقطيع والـ Buffering المستمر)
      const timeDifference = player.currentTime() - expectedTime;

      // لن نتدخل أبداً إذا كان الفارق أقل من ثانية (1.0) لترك المتصفح يحمل بسلاسة
      if (Math.abs(timeDifference) > 3.0) {
          isSystemAction = true;
          player.currentTime(expectedTime);
          player.playbackRate(1.0);
          setTimeout(() => { isSystemAction = false; }, 500);
      } else if (timeDifference > 1.0) {
          // التبطيء الناعم جداً فقط عند فارق يزيد عن ثانية
          player.playbackRate(0.95);
      } else if (timeDifference < -1.0) {
          // التسريع الناعم جداً فقط عند فارق يزيد عن ثانية
          player.playbackRate(1.05);
      } else {
          player.playbackRate(1.0);
      }

      // 4. مزامنة حالة التشغيل والإيقاف
      if (st.action === 'play' && player.paused()) {
        isSystemAction = true;
        player.play().catch(() => { isSystemAction = false; });
      } else if (st.action === 'pause' && !player.paused()) {
        isSystemAction = true;
        player.pause();
        setTimeout(() => { isSystemAction = false; }, 300);
      }
    });

    // ==========================================
    // 6. نظام الشات والإشعارات
    // ==========================================
    
    // إرسال رسالة نظام (مثل: شخص قام بتشغيل المقطع)
    function sendSystemMessage(text) {
      if(!currentUser) return;
      db.ref('chat').push({ isSystem: true, text: text, time: Date.now() });
    }

    function sendMessage() {
      if (!currentUser) return;
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (text) {
        db.ref('chat').push({ name: currentUser.name, avatar: currentUser.avatar, text: text, time: Date.now(), isSystem: false });
        input.value = "";
        db.ref(`typing/${userId}`).remove(); // إصلاح التوجيه لـ userId
      }
    }

    // إرسال الصور (مع ضغط الحجم آلياً لتقليل اللاق)
    function sendImage(input) {
      if (!currentUser) return;
      const file = input.files[0];
      if(!file) return;
      
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 300; // تصغير العرض ليناسب الشات فقط
          const scaleSize = MAX_WIDTH / img.width;
          canvas.width = MAX_WIDTH;
          canvas.height = img.height * scaleSize;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          
          // تحويل الصورة لصيغة webp الخفيفة بجودة 60%
          const compressedDataUrl = canvas.toDataURL('image/webp', 0.6); 
          db.ref('chat').push({ name: currentUser.name, avatar: currentUser.avatar, img: compressedDataUrl, time: Date.now(), isSystem: false });
          db.ref(`typing/${userId}`).remove();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
      input.value = "";
    }

    // زر التفريغ المعزول (لحذف الشات والسجل وتخفيف الحمل)
    function clearDatabase() {
      if(confirm("هل أنت متأكد من رغبتك في مسح الشات وسجل الروابط نهائياً؟ (لا يمكن التراجع)")) {
        db.ref('chat').remove();
        db.ref('history').remove();
        db.ref('typing').remove(); // ينظف أي زائر معلق فوراً
        sendSystemMessage(`قام ${currentUser.name} بتنظيف الغرفة 🧹`);
      }
    }

    // استماع للشات
    db.ref('chat').limitToLast(50).on('value', (snap) => {
      const msgDiv = document.getElementById('messages');
      // نحتفظ بمسافة السكرول الحالية لمعرفة ما إذا كان المستخدم يقرأ رسائل قديمة
      const isScrolledToBottom = msgDiv.scrollHeight - msgDiv.clientHeight <= msgDiv.scrollTop + 10;
      
      msgDiv.innerHTML = "";
      snap.forEach(c => {
        const m = c.val();
        
        if(m.isSystem) {
          msgDiv.innerHTML += `<div class="msg-system">${m.text}</div>`;
        } else {
          const isMine = currentUser && m.name === currentUser.name;
          
          // 1. التفريق بين الصورة العادية والملصق الصغير الشفاف
          let contentHtml = m.text ? `<div>${m.text}</div>` : '';
          if(m.img && m.isSticker) {
              contentHtml += `<img src="${m.img}" class="chat-sticker" onclick="openImageModal('${m.img}')">`;
          } else if(m.img) {
              contentHtml += `<img src="${m.img}" class="chat-img" onclick="openImageModal('${m.img}')">`;
          }
          
          // 2. زر الحذف الحقيقي المربوط بمفتاح الرسالة
          const msgKey = c.key;
          const deleteBtn = `<span onclick="deleteMessage('${msgKey}')" style="color: #ef4444; cursor: pointer; font-size: 0.8rem; margin: 0 4px; float: ${isMine ? 'left' : 'right'};" title="حذف الرسالة">✖</span>`;

          msgDiv.innerHTML += `
            <div class="msg-item ${isMine ? 'mine' : ''}" style="${isMine ? 'flex-direction: row-reverse;' : ''}">
              <img src="${m.avatar}" class="msg-avatar" />
              <div class="msg-content ${isMine ? 'mine' : ''} ${(m.isSticker && !m.text) ? 'sticker-bg' : ''}" style="width: 100%;">
                <span class="msg-name" style="display: block;">${m.name} ${deleteBtn}</span>
                ${contentHtml}
              </div>
            </div>
          `;
        }
      }); // <--- هذه هي القفلة المفقودة لحلقة التكرار!

      // النزول التلقائي إذا كان المستخدم في الأسفل أصلاً
      if (isScrolledToBottom) {
        msgDiv.scrollTop = msgDiv.scrollHeight;
      }
    });

    // ==========================================
    // 7. مؤشر الكتابة (Typing Indicator) - آمن ضد الرموز
    // ==========================================
    let typingTimeout;
    function handleTyping() {
      if (!currentUser) return;
      const typeRef = db.ref(`typing/${userId}`);
      typeRef.set(currentUser.name);
      typeRef.onDisconnect().remove(); // حماية إضافية من التعليق
      
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => { 
        typeRef.remove(); 
      }, 1500);
    }

    db.ref('typing').on('value', (snap) => {
      const area = document.getElementById('typingArea');
      const typists = [];
      if(snap.exists()) {
        snap.forEach(c => { 
          // نتأكد أن الاسم موجود وليس فارغاً، وأنه ليس أنا
          if (currentUser && c.key !== userId && c.val()) {
            typists.push(c.val());
          }
        });
      }

      if (typists.length === 1) {
        area.innerHTML = `${typists[0]} يكتب الآن... ✍️`;
      } else if (typists.length > 1) {
        area.innerHTML = `عدة أشخاص يكتبون الآن... ✍️`;
      } else {
        area.innerHTML = "";
      }
    });

    // ==========================================
    // 8. سجل الروابط وتكامل Google Drive
    // ==========================================
    db.ref('history').limitToLast(5).on('value', (snap) => {
      const box = document.getElementById('historyList');
      box.innerHTML = "";
      let hasItems = false;
      snap.forEach(c => {
        hasItems = true;
        const item = c.val();
        // تقصير الرابط الطويل لجمالية الشكل
        const shortUrl = item.url.length > 40 ? item.url.substring(0, 40) + '...' : item.url;
        box.innerHTML += `<div class="history-item" title="${item.url}" onclick="playFromHistory('${item.url}')">
          ▶ ${shortUrl} <span style="color:#6366f1; font-size:0.7rem;">(من ${item.sender || 'مجهول'})</span>
        </div>`;
      });
      if(!hasItems) box.innerHTML = "لا توجد مقاطع سابقة";
    });

    function playFromHistory(url) {
      db.ref('videoState').set({src: url, action: 'load', time: 0, timestamp: Date.now(), sender: currentUser.name});
      sendSystemMessage(`${currentUser.name} قام بتشغيل مقطع من السجل 🎬`);
    }

    // Google Drive Picker (تم ترك كودك هنا مع ملاحظة هامة)
    const CLIENT_ID = '925753610772-ih6q5ghbeg6g2imqtnefv9dqdsnjd1sv.apps.googleusercontent.com';
    let accessToken = null;

    function openDrivePicker() {
      const client = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/drive.readonly',
        callback: (res) => {
          if (res.access_token) {
            accessToken = res.access_token;
            gapi.load('picker', createPicker);
          }
        },
      });
      client.requestAccessToken();
    }

    function createPicker() {
      const view = new google.picker.View(google.picker.ViewId.DOCS);
      view.setMimeTypes('video/mp4,video/x-matroska,video/webm');
      const picker = new google.picker.PickerBuilder()
        .addView(view)
        .setOAuthToken(accessToken)
        .setCallback(pickerCallback)
        .build();
      picker.setVisible(true);
    }

    function pickerCallback(data) {
      if (data.action === google.picker.Action.PICKED) {
        const file = data.docs[0];
        
        // استخدام خدمة Worker/Proxy مفتوحة المصدر لتجاوز قيود درايف
        // هذا الرابط يأخذ الـ ID الخاص بالفيديو ويعيد دفق MP4 حقيقي
        const streamUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent('https://drive.google.com/uc?export=download&id=' + file.id)}`;
        
        db.ref('videoState').set({ src: streamUrl, action: 'load', time: 0, timestamp: Date.now(), sender: currentUser.name });
        db.ref('history').push({ url: file.name + ' (Drive)', time: Date.now(), sender: currentUser.name });
        sendSystemMessage(`${currentUser.name} أضاف مقطعاً من Google Drive 📁`);
      }
    }

    // ==========================================
    // 9. إضافات خاصة (الملصقات، التكبير، السخرية من الحذف، وإصلاح كيبورد الآيباد)
    // ==========================================

    // فتح الصور بنافذة شفافة 
    function openImageModal(src) {
      document.getElementById('expandedImg').src = src;
      document.getElementById('imageModal').style.display = 'flex';
    }

    // [الحذف الحقيقي للرسالة مع ترك أثر ساخر 😂]
    function deleteMessage(msgKey) {
      if (!currentUser) return;
      if(confirm("هل أنت متأكد من مسح الرسالة؟ 👀")) {
        db.ref('chat/' + msgKey).update({ 
          text: "(افا حذفتي ، يلا عاد شنسوي somy is being somy)", 
          img: null,
          isSticker: false
        });
      }
    }

    // نظام الملصقات الدائمة (الشبكة العمودية + التعديل)
    let isEditingStickers = false;

    function toggleStickers() {
      const panel = document.getElementById('stickersPanel');
      panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
      if(panel.style.display === 'none') { 
          isEditingStickers = false; 
          document.getElementById('editStickersBtn').style.background = '#f59e0b'; 
          renderStickers(); 
      }
    }

    function toggleEditStickers() {
      isEditingStickers = !isEditingStickers;
      document.getElementById('editStickersBtn').style.background = isEditingStickers ? '#22c55e' : '#f59e0b';
      renderStickers();
    }

    function uploadSticker(input) {
      const file = input.files[0];
      if(!file) return;
      
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 120; // حجم الملصقات صغير جداً ومناسب للشبكة 8 أعمدة
          const scaleSize = MAX_WIDTH / img.width;
          canvas.width = MAX_WIDTH;
          canvas.height = img.height * scaleSize;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          
          // الحفاظ على الشفافية مع جودة مخفضة (50%)
          const compressedDataUrl = canvas.toDataURL('image/webp', 0.5); 
          db.ref('savedStickers').push({ img: compressedDataUrl, order: Date.now() });
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
      input.value = "";
    }

    function sendSavedSticker(imgSrc) {
      if(isEditingStickers) return;
      db.ref('chat').push({ name: currentUser.name, avatar: currentUser.avatar, img: imgSrc, isSticker: true, time: Date.now(), isSystem: false });
      toggleStickers();
    }

    function deleteSticker(sKey) {
      if(confirm("حذف هذا الملصق نهائياً؟")) db.ref('savedStickers/' + sKey).remove();
    }

    function moveSticker(sKey, currentOrder, direction) {
        db.ref('savedStickers/' + sKey).update({ order: currentOrder + (direction === 'up' ? -15000 : 15000) });
    }

    let globalStickers = [];
    db.ref('savedStickers').on('value', snap => {
      globalStickers = [];
      snap.forEach(c => { globalStickers.push({ key: c.key, ...c.val() }); });
      // ترتيب الملصقات برمجياً حسب الأقدمية/التعديل
      globalStickers.sort((a, b) => (a.order || 0) - (b.order || 0));
      renderStickers();
    });

    function renderStickers() {
      const container = document.getElementById('stickersContainer');
      if(!container) return;
      container.innerHTML = "";
      if(globalStickers.length === 0) {
          container.innerHTML = `<span style="font-size: 0.8rem; color: var(--text-muted); grid-column: span 4; text-align: center;">لا توجد ملصقات، أضف ملصقاتك الآن!</span>`;
          return;
      }
      
      globalStickers.forEach((s) => {
         const orderNum = s.order || Date.now();
         if(isEditingStickers) {
             container.innerHTML += `
             <div style="position: relative; display: flex; flex-direction: column; align-items: center; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 8px;">
                <img src="${s.img}" style="width: 100%; aspect-ratio: 1; object-fit: contain;">
                <button onclick="deleteSticker('${s.key}')" style="background: #ef4444; padding: 2px 5px; font-size: 0.7rem; margin-top: 5px; width: 100%; border-radius: 4px;">🗑️</button>
                <div style="display:flex; width: 100%; gap: 2px; margin-top: 2px;">
                  <button onclick="moveSticker('${s.key}', ${orderNum}, 'up')" style="flex:1; padding: 2px; font-size:0.7rem; background:#334155; border-radius: 4px;">◀</button>
                  <button onclick="moveSticker('${s.key}', ${orderNum}, 'down')" style="flex:1; padding: 2px; font-size:0.7rem; background:#334155; border-radius: 4px;">▶</button>
                </div>
             </div>`;
         } else {
             container.innerHTML += `<img src="${s.img}" style="width: 100%; aspect-ratio: 1; object-fit: contain; cursor: pointer; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));" onclick="sendSavedSticker('${s.img}')" title="إرسال">`;
         }
      });
    }

  </script>
</body>
