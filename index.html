<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Anime Watch Together Pro</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0b0f19; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    .video-container { flex-shrink: 0; width: 100%; background: #000; position: relative; border-bottom: 2px solid #1e293b; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    video { width: 100%; max-height: 38vh; height: 230px; display: block; object-fit: contain; }

    .content-area { flex: 1; display: flex; flex-direction: column; padding: 10px; gap: 8px; overflow: hidden; background: #0f172a; }

    .status-bar { display: flex; gap: 8px; align-items: center; background: #1e293b; padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; overflow-x: auto; border: 1px solid #334155; }
    .user-badge { display: flex; align-items: center; gap: 6px; background: #0f172a; padding: 3px 10px; border-radius: 20px; flex-shrink: 0; border: 1px solid #1e293b; }
    .user-avatar { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; }
    .user-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 6px #22c55e; }

    .input-group { display: flex; gap: 6px; }
    input { flex: 1; padding: 8px 12px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 0.85rem; outline: none; }
    input:focus { border-color: #6366f1; }
    button { padding: 8px 14px; background: #6366f1; border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; font-size: 0.8rem; white-space: nowrap; transition: 0.2s; }
    button:hover { background: #4f46e5; }
    button.drive-btn { background: #2563eb; }
    button.drive-btn:hover { background: #1d4ed8; }

    .history-box { background: #1e293b; border-radius: 6px; padding: 6px 10px; font-size: 0.75rem; max-height: 50px; overflow-y: auto; border: 1px solid #334155; }
    .history-item { padding: 3px 6px; background: #0f172a; border-radius: 4px; margin-bottom: 3px; cursor: pointer; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
    .history-item:hover { color: #818cf8; }

    .chat-container { flex: 1; display: flex; flex-direction: column; background: #1e293b; border-radius: 8px; padding: 10px; overflow: hidden; border: 1px solid #334155; }
    #messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 4px; }
    .msg-item { display: flex; align-items: flex-start; gap: 8px; font-size: 0.85rem; }
    .msg-avatar { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; border: 1px solid #475569; }
    .msg-content { background: #0f172a; padding: 6px 10px; border-radius: 8px; max-width: 85%; word-break: break-word; border: 1px solid #1e293b; }
    .msg-name { font-weight: bold; color: #818cf8; font-size: 0.75rem; display: block; margin-bottom: 2px; }
    .typing-indicator { font-size: 0.75rem; color: #94a3b8; font-style: italic; min-height: 16px; margin-top: 2px; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; backdrop-filter: blur(4px); }
    .modal-card { background: #1e293b; width: 100%; max-width: 320px; border-radius: 12px; padding: 20px; text-align: center; display: flex; flex-direction: column; gap: 12px; border: 1px solid #475569; }
    .avatar-picker { display: flex; justify-content: center; gap: 12px; margin: 8px 0; }
    .avatar-opt { width: 48px; height: 48px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; object-fit: cover; transition: 0.2s; }
    .avatar-opt.selected { border-color: #6366f1; transform: scale(1.1); }
  </style>
</head>
<body>

  <div id="profileModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <h3>بروفايل المشاهدة</h3>
      <p style="font-size:0.8rem; color:#94a3b8;">اختر الصورة والاسم للدخول:</p>
      <div class="avatar-picker">
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Alien" class="avatar-opt selected" onclick="selectAvatar(this)" />
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Vamp" class="avatar-opt" onclick="selectAvatar(this)" />
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Cat" class="avatar-opt" onclick="selectAvatar(this)" />
      </div>
      <input type="text" id="initUsername" placeholder="الاسم..." value="Alien" />
      <button onclick="saveProfile()">حفظ والدخول</button>
    </div>
  </div>

  <div class="video-container">
    <video id="videoPlayer" controls playsinline crossorigin="anonymous">
      <source id="videoSource" src="" type="video/mp4">
    </video>
  </div>

  <div class="content-area">
    <div class="status-bar" id="usersStatus"><b>المتصلون:</b></div>

    <div class="input-group">
      <button onclick="openDrivePicker()" class="drive-btn">📁 Google Drive</button>
      <input type="text" id="videoUrlInput" placeholder="أو رابط MP4 مباشر..." />
      <button onclick="changeVideoManual()">تشغيل</button>
    </div>

    <div class="history-box">
      <div style="font-weight:bold; color:#94a3b8; margin-bottom:2px;">السجل:</div>
      <div id="historyList">لا يوجد روابط مسجلة</div>
    </div>

    <div class="chat-container">
      <div id="messages"></div>
      <div id="typingArea" class="typing-indicator"></div>
      <div class="input-group" style="margin-top: 5px;">
        <input type="text" id="messageInput" placeholder="اكتب رسالة..." oninput="handleTyping()" onkeypress="if(event.key==='Enter') sendMessage()" />
        <button onclick="sendMessage()">إرسال</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAs57mg-SUx-QFeYsqky4SIvph71n5uB5w",
      authDomain: "with-somy.firebaseapp.com",
      databaseURL: "https://with-somy-default-rtdb.firebaseio.com",
      projectId: "with-somy",
      storageBucket: "with-somy.firebasestorage.app",
      messagingSenderId: "925753610772",
      appId: "1:925753610772:web:1c1c7784d6f5c686d4d01"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const video = document.getElementById('videoPlayer');

    const CLIENT_ID = '925753610772-ih6q5ghbeg6g2imqtnefv9dqdsnjd1sv.apps.googleusercontent.com';
    let accessToken = null;

    function openDrivePicker() {
      const client = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/drive.readonly',
        callback: (res) => {
          if (res.access_token) {
            accessToken = res.access_token;
            gapi.load('picker', createPicker);
          }
        },
      });
      client.requestAccessToken();
    }

    function createPicker() {
      const view = new google.picker.View(google.picker.ViewId.DOCS);
      view.setMimeTypes('video/mp4,video/x-matroska,video/webm');
      const picker = new google.picker.PickerBuilder()
        .addView(view)
        .setOAuthToken(accessToken)
        .setCallback(pickerCallback)
        .build();
      picker.setVisible(true);
    }

    function pickerCallback(data) {
      if (data.action === google.picker.Action.PICKED) {
        const file = data.docs[0];
        const streamUrl = `https://www.googleapis.com/drive/v3/files/${file.id}?alt=media&access_token=${accessToken}`;
        db.ref('videoState').set({ src: streamUrl, action: 'load', time: 0 });
        db.ref('history').push({ url: file.name, time: Date.now() });
      }
    }

    let currentUser = JSON.parse(localStorage.getItem('app_user_profile')) || null;
    let selectedAvatarUrl = "https://api.dicebear.com/7.x/bottts/svg?seed=Alien";

    if (!currentUser) document.getElementById('profileModal').style.display = 'flex';
    else initPresence();

    function selectAvatar(el) {
      document.querySelectorAll('.avatar-opt').forEach(img => img.classList.remove('selected'));
      el.classList.add('selected');
      selectedAvatarUrl = el.src;
    }

    function saveProfile() {
      const name = document.getElementById('initUsername').value.trim() || "Alien";
      currentUser = { name: name, avatar: selectedAvatarUrl };
      localStorage.setItem('app_user_profile', JSON.stringify(currentUser));
      document.getElementById('profileModal').style.display = 'none';
      initPresence();
    }

    function initPresence() {
      if(!currentUser) return;
      const userRef = db.ref('onlineUsers').push();
      userRef.onDisconnect().remove();
      userRef.set({ name: currentUser.name, avatar: currentUser.avatar });

      db.ref('onlineUsers').on('value', (snap) => {
        const bar = document.getElementById('usersStatus');
        bar.innerHTML = "<b>المتصلون:</b> ";
        snap.forEach(child => {
          const u = child.val();
          bar.innerHTML += `
            <div class="user-badge">
              <span class="user-dot"></span>
              <img src="${u.avatar}" class="user-avatar" />
              <span>${u.name}</span>
            </div>
          `;
        });
      });
    }

    let isRemote = false;

    function changeVideoManual() {
      const url = document.getElementById('videoUrlInput').value.trim();
      if (!url) return;
      db.ref('videoState').set({ src: url, action: 'load', time: 0 });
      db.ref('history').push({ url: url, time: Date.now() });
    }

    video.onplay = () => { if (!isRemote) db.ref('videoState').update({ action: 'play', time: video.currentTime }); };
    video.onpause = () => { if (!isRemote) db.ref('videoState').update({ action: 'pause', time: video.currentTime }); };
    video.onseeking = () => { if (!isRemote) db.ref('videoState').update({ time: video.currentTime }); };

    db.ref('videoState').on('value', (snap) => {
      const st = snap.val();
      if (!st) return;
      isRemote = true;

      if (st.action === 'load' && document.getElementById('videoSource').src !== st.src) {
        document.getElementById('videoSource').src = st.src;
        video.load();
      }

      if (Math.abs(video.currentTime - st.time) > 1.2) video.currentTime = st.time;

      if (st.action === 'play' && video.paused) video.play().catch(() => {});
      else if (st.action === 'pause' && !video.paused) video.pause();

      setTimeout(() => { isRemote = false; }, 300);
    });

    db.ref('history').limitToLast(4).on('value', (snap) => {
      const box = document.getElementById('historyList');
      box.innerHTML = "";
      snap.forEach(c => {
        const item = c.val();
        box.innerHTML += `<div class="history-item" onclick="db.ref('videoState').set({src:'${item.url}',action:'load',time:0})">▶ ${item.url}</div>`;
      });
    });

    let typingTimeout;
    function handleTyping() {
      if (!currentUser) return;
      db.ref('typing/' + currentUser.name).set(true);
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => { db.ref('typing/' + currentUser.name).remove(); }, 2000);
    }

    db.ref('typing').on('value', (snap) => {
      const area = document.getElementById('typingArea');
      area.innerHTML = "";
      snap.forEach(c => {
        if (currentUser && c.key !== currentUser.name) area.innerHTML = `${c.key} يكتب الآن...`;
      });
    });

    function sendMessage() {
      if (!currentUser) return;
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (text) {
        db.ref('chat').push({ name: currentUser.name, avatar: currentUser.avatar, text: text, time: Date.now() });
        input.value = "";
        db.ref('typing/' + currentUser.name).remove();
      }
    }

    db.ref('chat').limitToLast(20).on('value', (snap) => {
      const msgDiv = document.getElementById('messages');
      msgDiv.innerHTML = "";
      snap.forEach(c => {
        const m = c.val();
        msgDiv.innerHTML += `
          <div class="msg-item">
            <img src="${m.avatar || 'https://api.dicebear.com/7.x/bottts/svg?seed=User'}" class="msg-avatar" />
            <div class="msg-content">
              <span class="msg-name">${m.name}</span>
              <div>${m.text}</div>
            </div>
          </div>
        `;
      });
      msgDiv.scrollTop = msgDiv.scrollHeight;
    });

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', () => {
        document.body.style.height = window.visualViewport.height + 'px';
        const msgDiv = document.getElementById('messages');
        msgDiv.scrollTop = msgDiv.scrollHeight;
      });
    }
  </script>
</body>
</html>
