<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Anime Watch Together Pro</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #0f172a; color: #fff; height: 100vh; display: flex; flex-direction: column; }
    .video-area { flex-shrink: 0; background: #000; width: 100%; position: relative; padding-top: 56.25%; }
    .video-area iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    
    .main-scroll { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    .input-group { display: flex; gap: 5px; }
    input { flex: 1; padding: 10px; border-radius: 6px; border: none; background: #1e293b; color: #fff; }
    button { padding: 8px 12px; background: #6366f1; border: none; border-radius: 6px; color: #fff; cursor: pointer; font-size: 0.8rem; }
    
    /* أزرار المزامنة */
    .sync-btn { background: #ef4444; color: white; padding: 10px; border-radius: 6px; text-align: center; cursor: pointer; margin-top: 5px; font-weight: bold; }
    
    .chat-box { background: #1e293b; padding: 10px; border-radius: 8px; flex-grow: 1; overflow-y: auto; }
    .msg { font-size: 0.9rem; margin-bottom: 5px; }
  </style>
</head>
<body>

  <div class="video-area">
    <iframe id="player" allow="autoplay; fullscreen" allowfullscreen></iframe>
  </div>

  <div class="main-scroll">
    <!-- أدوات التحكم -->
    <div class="input-group">
      <input type="text" id="username" placeholder="اسمك..." />
      <input type="text" id="driveUrl" placeholder="رابط درايف..." />
      <button onclick="updateVideo()">تشغيل</button>
    </div>

    <!-- لوحة المزامنة -->
    <div style="display: flex; gap: 5px;">
        <input type="text" id="timeInput" placeholder="الدقيقة (مثلاً 05:30)" />
        <button onclick="sendSync()" style="background:#22c55e;">مزامنة الوقت</button>
    </div>
    <div id="syncAlert"></div>

    <div id="messages" class="chat-box"></div>
    <div class="input-group">
      <input type="text" id="messageInput" placeholder="رسالة..." />
      <button onclick="sendMessage()">إرسال</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAs57mg-SUx-QFeYsqky4SIvph71n5uB5w",
      authDomain: "with-somy.firebaseapp.com",
      databaseURL: "https://with-somy-default-rtdb.firebaseio.com",
      projectId: "with-somy",
      storageBucket: "with-somy.firebasestorage.app",
      messagingSenderId: "925753610772",
      appId: "1:925753610772:web:1c1c7784d6f5c686d4d01"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // تشغيل الفيديو
    function updateVideo() {
      const url = document.getElementById('driveUrl').value.trim();
      let fileId = url.includes('/d/') ? url.split('/d/')[1].split('/')[0] : (url.includes('id=') ? url.split('id=')[1].split('&')[0] : null);
      if(fileId) db.ref('currentVideo').set(fileId);
    }
    db.ref('currentVideo').on('value', (s) => { if(s.val()) document.getElementById('player').src = `https://drive.google.com/file/d/${s.val()}/preview`; });

    // المزامنة اليدوية الذكية
    function sendSync() {
        const time = document.getElementById('timeInput').value;
        db.ref('sync').set({ sender: document.getElementById('username').value, time: time });
    }

    db.ref('sync').on('value', (s) => {
        const data = s.val();
        if(data) {
            document.getElementById('syncAlert').innerHTML = `
                <div class="sync-btn">صديقتك ${data.sender} وصلت للدقيقة ${data.time}</div>
            `;
        }
    });

    // الشات
    function sendMessage() {
        const name = document.getElementById('username').value;
        const msg = document.getElementById('messageInput').value;
        if(msg) { db.ref('chat').push({name, msg}); document.getElementById('messageInput').value = ""; }
    }
    db.ref('chat').limitToLast(10).on('value', (s) => {
        const m = document.getElementById('messages');
        m.innerHTML = "";
        s.forEach(c => { m.innerHTML += `<div class="msg"><b>${c.val().name}:</b> ${c.val().msg}</div>`; });
    });
  </script>
</body>
</html>
