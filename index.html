<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Anime Sync Pro</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    body { background: #000; color: #fff; display: flex; flex-direction: column; height: 100vh; }
    video { width: 100%; max-height: 70vh; background: #000; }
    .controls { padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    input { padding: 10px; border-radius: 6px; border: none; }
    button { padding: 10px; background: #6366f1; border: none; color: #fff; border-radius: 6px; }
  </style>
</head>
<body>

  <video id="videoPlayer" controls>
    <source src="" type="video/mp4">
  </video>

  <div class="controls">
    <input type="text" id="directUrl" placeholder="الصقي رابط الفيديو المباشر (.mp4)..." />
    <button onclick="changeVideo()">تغيير الفيديو</button>
  </div>

  <script>
    const firebaseConfig = { /* (ضعي إعداداتكِ هنا كما هي في الكود السابق) */ };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const video = document.getElementById('videoPlayer');

    // 1. تغيير الفيديو للطرفين
    function changeVideo() {
        const url = document.getElementById('directUrl').value;
        db.ref('videoState').set({ src: url, action: 'load', time: 0 });
    }

    // 2. إرسال الأوامر (Play / Pause / Seek)
    video.onplay = () => db.ref('videoState/action').set('play');
    video.onpause = () => db.ref('videoState/action').set('pause');
    video.onseeking = () => db.ref('videoState/time').set(video.currentTime);

    // 3. استقبال الأوامر من الطرف الآخر
    db.ref('videoState').on('value', (s) => {
        const state = s.val();
        if(state.action === 'load') { video.src = state.src; }
        else if(state.action === 'play') { video.play(); }
        else if(state.action === 'pause') { video.pause(); }
        else if(state.time !== video.currentTime) { video.currentTime = state.time; }
    });
  </script>
</body>
</html>
