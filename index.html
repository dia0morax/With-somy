<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Anime Watch Together Ultimate</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0f172a; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .video-container { flex-shrink: 0; width: 100%; background: #000; position: relative; }
    video { width: 100%; max-height: 35vh; display: block; object-fit: contain; }
    .content-area { flex: 1; display: flex; flex-direction: column; padding: 10px; gap: 8px; overflow: hidden; }
    .status-bar { display: flex; gap: 10px; align-items: center; background: #1e293b; padding: 6px 10px; border-radius: 8px; font-size: 0.8rem; overflow-x: auto; }
    .user-badge { display: flex; align-items: center; gap: 6px; background: #0f172a; padding: 3px 8px; border-radius: 20px; }
    .user-avatar { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; }
    .user-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
    .input-group { display: flex; gap: 6px; }
    input { flex: 1; padding: 8px 10px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 0.85rem; outline: none; }
    button { padding: 8px 12px; background: #6366f1; border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
    .history-box { background: #1e293b; border-radius: 6px; padding: 6px; font-size: 0.75rem; max-height: 50px; overflow-y: auto; }
    .history-item { padding: 4px 6px; background: #0f172a; border-radius: 4px; margin-bottom: 3px; cursor: pointer; }
    .chat-container { flex: 1; display: flex; flex-direction: column; background: #1e293b; border-radius: 8px; padding: 8px; overflow: hidden; }
    #messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .msg-item { display: flex; align-items: flex-start; gap: 8px; font-size: 0.85rem; }
    .msg-avatar { width: 24px; height: 24px; border-radius: 50%; }
    .msg-content { background: #0f172a; padding: 6px 10px; border-radius: 8px; max-width: 85%; }
    .typing-indicator { font-size: 0.7rem; color: #94a3b8; height: 15px; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal-card { background: #1e293b; width: 300px; padding: 20px; border-radius: 12px; text-align: center; }
  </style>
</head>
<body>

  <div id="profileModal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <h3>بروفايل المشاهدة</h3>
      <input type="text" id="initUsername" placeholder="اسمك..." style="width:100%; margin:10px 0;">
      <button onclick="saveProfile()" style="width:100%;">دخول</button>
    </div>
  </div>

  <div class="video-container">
    <video id="videoPlayer" controls playsinline crossorigin="anonymous"></video>
  </div>

  <div class="content-area">
    <div class="status-bar" id="usersStatus"></div>
    <div class="input-group">
      <input type="text" id="videoUrlInput" placeholder="رابط درايف أو فيديو..." />
      <button onclick="changeVideo()">تشغيل</button>
    </div>
    <div class="history-box" id="historyList"></div>
    <div class="chat-container">
      <div id="messages"></div>
      <div id="typingArea" class="typing-indicator"></div>
      <div class="input-group" style="margin-top:5px;">
        <input type="text" id="messageInput" placeholder="رسالة..." oninput="handleTyping()" onkeypress="if(event.key==='Enter') sendMessage()" />
        <button onclick="sendMessage()">إرسال</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAs57mg-SUx-QFeYsqky4SIvph71n5uB5w",
      authDomain: "with-somy.firebaseapp.com",
      databaseURL: "https://with-somy-default-rtdb.firebaseio.com",
      projectId: "with-somy",
      storageBucket: "with-somy.firebasestorage.app",
      messagingSenderId: "925753610772",
      appId: "1:925753610772:web:1c1c7784d6f5c686d4d01"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const video = document.getElementById('videoPlayer');
    let currentUser = JSON.parse(localStorage.getItem('app_user_profile'));

    if(!currentUser) document.getElementById('profileModal').style.display = 'flex';
    else initPresence();

    function saveProfile() {
      currentUser = { name: document.getElementById('initUsername').value || "زائر", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed="+Math.random() };
      localStorage.setItem('app_user_profile', JSON.stringify(currentUser));
      document.getElementById('profileModal').style.display = 'none';
      initPresence();
    }

    function initPresence() {
      const userRef = db.ref('onlineUsers').push();
      userRef.onDisconnect().remove();
      userRef.set({ name: currentUser.name, avatar: currentUser.avatar });
      db.ref('onlineUsers').on('value', (snap) => {
        const bar = document.getElementById('usersStatus');
        bar.innerHTML = "<b>المتواجدون:</b> ";
        snap.forEach(c => { bar.innerHTML += `<div class="user-badge"><span class="user-dot"></span>${c.val().name}</div>`; });
      });
    }

    // --- (الجزء الحاسم: محاولة تشغيل الفيديو) ---
    function changeVideo() {
      let url = document.getElementById('videoUrlInput').value.trim();
      // هنا نستخدم "جسر" Proxy بسيط للالتفاف على الحماية
      // يمكن تغيير الرابط التالي إذا توقف البروكسي عن العمل
      const bridgeUrl = "https://corsproxy.io/?" + encodeURIComponent(url);
      
      db.ref('videoState').set({ src: bridgeUrl, action: 'load', time: 0 });
      db.ref('history').push({ url: url, time: Date.now() });
    }

    // المزامنة التلقائية (نفس الكود السابق)
    let isRemote = false;
    video.onplay = () => { if(!isRemote) db.ref('videoState').update({action: 'play', time: video.currentTime}); };
    video.onpause = () => { if(!isRemote) db.ref('videoState').update({action: 'pause', time: video.currentTime}); };
    
    db.ref('videoState').on('value', (snap) => {
      const st = snap.val();
      if(!st) return;
      isRemote = true;
      if(st.action === 'load' && video.src !== st.src) { video.src = st.src; video.load(); }
      if(st.action === 'play') video.play().catch(()=>{});
      if(st.action === 'pause') video.pause();
      setTimeout(() => { isRemote = false; }, 500);
    });

    // الشات (نفس الكود السابق)
    function sendMessage() {
        const input = document.getElementById('messageInput');
        if(input.value) { 
            db.ref('chat').push({ name: currentUser.name, text: input.value, time: Date.now() });
            input.value = "";
        }
    }
    db.ref('chat').limitToLast(10).on('value', (snap) => {
        const m = document.getElementById('messages');
        m.innerHTML = "";
        snap.forEach(c => { m.innerHTML += `<div class="msg-item"><div class="msg-content"><span class="msg-name">${c.val().name}</span>${c.val().text}</div></div>`; });
        m.scrollTop = m.scrollHeight;
    });

    function handleTyping() {
        db.ref('typing/'+currentUser.name).set(true);
        setTimeout(() => db.ref('typing/'+currentUser.name).remove(), 2000);
    }
    db.ref('typing').on('value', (snap) => {
        const t = document.getElementById('typingArea');
        t.innerHTML = "";
        snap.forEach(c => { if(c.key !== currentUser.name) t.innerHTML = c.key + " يكتب..."; });
    });
  </script>
</body>
</html>
