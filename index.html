<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Anime Watch Together</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
  <style>
    :root { --primary: #6366f1; --bg: #0b0f19; --card: #1e293b; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: var(--bg); color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    /* الفيديو */
    .video-section { flex-shrink: 0; width: 100%; aspect-ratio: 16/9; background: #000; }
    #videoPlayer { width: 100%; height: 100%; }
    #driveFrame { width: 100%; height: 100%; display: none; border: none; }
    
    /* المحتوى */
    .main-content { flex: 1; display: flex; flex-direction: column; padding: 10px; gap: 8px; overflow: hidden; }
    .status-bar { display: flex; gap: 8px; align-items: center; background: var(--card); padding: 8px; border-radius: 8px; font-size: 0.8rem; }
    .user-badge { display: flex; align-items: center; gap: 5px; background: #0f172a; padding: 2px 8px; border-radius: 12px; }
    
    /* الشات */
    .chat-container { flex: 1; background: var(--card); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; overflow: hidden; }
    #messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .msg-item { display: flex; gap: 8px; align-items: start; }
    .msg-bubble { background: #0f172a; padding: 6px 10px; border-radius: 8px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="video-section">
    <video id="videoPlayer" playsinline></video>
    <iframe id="driveFrame"></iframe>
  </div>

  <div class="main-content">
    <div class="status-bar" id="usersStatus">
        <b>المتصلون:</b>
        <button onclick="if(confirm('تصفير القائمة؟')) db.ref('onlineUsers').remove()" style="background:#ef4444; color:white; border:none; padding:2px 5px; font-size:0.6rem; cursor:pointer;">تصفير</button>
    </div>
    
    <div style="display:flex; gap:5px;">
        <input type="text" id="urlIn" placeholder="رابط MP4 أو Drive..." style="flex:1; padding:8px; border-radius:6px; border:none;">
        <button onclick="sendVideoLoad()">تشغيل</button>
    </div>

    <div id="historyList" style="font-size:0.7rem; color:#94a3b8; overflow-x:auto; display:flex; gap:5px;"></div>

    <div class="chat-container">
      <div id="messages"></div>
      <div id="typing" style="font-size:0.7rem; color:#6366f1; height:15px;"></div>
      <div style="display:flex; gap:5px;">
        <input type="text" id="msgIn" oninput="db.ref('typing/'+uID).set(uName)" style="flex:1; padding:8px; border-radius:6px; border:none;">
        <button onclick="sendMsg()">إرسال</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = { apiKey: "AIzaSyAs57mg-SUx-QFeYsqky4SIvph71n5uB5w", databaseURL: "https://with-somy-default-rtdb.firebaseio.com", projectId: "with-somy" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let uID = localStorage.getItem('uID') || 'u_' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('uID', uID);
    let uName = localStorage.getItem('uName') || prompt("اسمك؟") || "زائر";
    localStorage.setItem('uName', uName);

    const player = new Plyr('#videoPlayer');
    let isRemote = false;

    // حضور
    db.ref('onlineUsers/'+uID).onDisconnect().remove();
    db.ref('onlineUsers/'+uID).set({ name: uName });
    db.ref('onlineUsers').on('value', snap => {
        let bar = document.getElementById('usersStatus');
        bar.innerHTML = "<b>المتصلون:</b> <button onclick=\"if(confirm('تصفير القائمة؟')) db.ref('onlineUsers').remove()\" style='background:#ef4444; color:white; border:none; padding:2px 5px; font-size:0.6rem;'>تصفير</button>";
        snap.forEach(c => bar.innerHTML += `<div class="user-badge">${c.val().name}</div>`);
    });

    // فيديو ومزامنة
    function sendVideoLoad() {
        let url = document.getElementById('urlIn').value;
        db.ref('videoState').set({ src: url, action: 'load', time: 0 });
        db.ref('history').push({ url: url });
    }

    db.ref('videoState').on('value', snap => {
        let st = snap.val(); if(!st) return;
        isRemote = true;
        if(st.src.includes('drive')) {
            document.getElementById('videoPlayer').style.display='none';
            document.getElementById('driveFrame').style.display='block';
            document.getElementById('driveFrame').src = st.src.replace('/view', '/preview');
        } else {
            document.getElementById('driveFrame').style.display='none';
            document.getElementById('videoPlayer').style.display='block';
            player.source = { type: 'video', sources: [{ src: st.src, type: 'video/mp4' }] };
        }
        setTimeout(()=> isRemote = false, 1000);
    });

    player.on('play', () => { if(!isRemote) db.ref('sync').set({action: 'play', time: player.currentTime}); });
    player.on('pause', () => { if(!isRemote) db.ref('sync').set({action: 'pause', time: player.currentTime}); });
    player.on('seeking', () => { if(!isRemote) db.ref('sync').set({action: 'seek', time: player.currentTime}); });

    db.ref('sync').on('value', snap => {
        let s = snap.val(); if(!s || isRemote) return;
        if(s.action == 'play') player.play();
        if(s.action == 'pause') player.pause();
        if(s.action == 'seek') player.currentTime = s.time;
    });

    // شات
    function sendMsg() {
        let m = document.getElementById('msgIn');
        if(m.value) { db.ref('chat').push({ name: uName, text: m.value }); m.value = ''; }
    }
    db.ref('chat').limitToLast(10).on('value', snap => {
        let d = document.getElementById('messages'); d.innerHTML = '';
        snap.forEach(c => d.innerHTML += `<div class="msg-item"><div class="msg-bubble"><b>${c.val().name}:</b> ${c.val().text}</div></div>`);
        d.scrollTop = d.scrollHeight;
    });
  </script>
</body>
</html>
