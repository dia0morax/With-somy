<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Watch Together</title>
  <!-- مكتبات Firebase الجاهزة -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0f172a; color: #fff; display: flex; justify-content: center; padding: 15px; }
    .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 15px; }
    
    .input-group { display: flex; gap: 8px; flex-wrap: wrap; }
    input { flex: 1; min-width: 150px; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #fff; outline: none; }
    button { padding: 10px 18px; background: #6366f1; border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; }
    button:hover { background: #4f46e5; }

    .video-wrapper { position: relative; width: 100%; padding-top: 56.25%; background: #000; border-radius: 8px; overflow: hidden; }
    iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

    /* تنسيق الدردشة */
    .chat-box { background: #1e293b; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    #messages { height: 160px; overflow-y: auto; background: #0f172a; padding: 10px; border-radius: 6px; display: flex; flex-direction: column; gap: 6px; }
    .msg-item { font-size: 0.9rem; line-height: 1.4; word-break: break-word; }
    .msg-name { font-weight: bold; color: #818cf8; margin-left: 5px; }
  </style>
</head>
<body>

  <div class="container">
    <!-- إدخال الاسم ورابط الحلقة -->
    <div class="input-group">
      <input type="text" id="username" placeholder="اسمكِ..." value="Alien" />
      <input type="text" id="driveUrl" placeholder="الصقي رابط Google Drive هنا..." />
      <button onclick="playVideo()">تشغيل</button>
    </div>

    <!-- مشغل الفيديو -->
    <div class="video-wrapper">
      <iframe id="player" allowfullscreen></iframe>
    </div>

    <!-- قسم الشات -->
    <div class="chat-box">
      <div id="messages"></div>
      <div class="input-group">
        <input type="text" id="messageInput" placeholder="اكتبي رسالة..." onkeypress="if(event.key==='Enter') sendMessage()" />
        <button onclick="sendMessage()">إرسال</button>
      </div>
    </div>
  </div>

  <script>
    // إعدادات Firebase الخاصة بمشروعكِ
    const firebaseConfig = {
      apiKey: "AIzaSyAs57mg-SUx-QFeYsqky4SIvph71n5uB5w",
      authDomain: "with-somy.firebaseapp.com",
      databaseURL: "https://with-somy-default-rtdb.firebaseio.com",
      projectId: "with-somy",
      storageBucket: "with-somy.firebasestorage.app",
      messagingSenderId: "925753610772",
      appId: "1:925753610772:web:1c1c7784d6f5c686d4d01"
    };

    // تهيئة السيرفر
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // تشغيل الفيديو للطرفين عند تغيير الرابط
    function playVideo() {
      const url = document.getElementById('driveUrl').value.trim();
      let fileId = "";
      if (url.includes('/d/')) {
        fileId = url.split('/d/')[1].split('/')[0];
      } else if (url.includes('id=')) {
        fileId = url.split('id=')[1].split('&')[0];
      }

      if (fileId) {
        db.ref('currentVideo').set(fileId);
      } else {
        alert("تأكدي من صحة الرابط!");
      }
    }

    // مزامنة فتح الحلقة للطرفين
    db.ref('currentVideo').on('value', (snapshot) => {
      const fileId = snapshot.val();
      if (fileId) {
        document.getElementById('player').src = `https://drive.google.com/file/d/${fileId}/preview`;
      }
    });

    // إرسال رسالة الشات
    function sendMessage() {
      const name = document.getElementById('username').value.trim() || "زائر";
      const msgInput = document.getElementById('messageInput');
      const text = msgInput.value.trim();

      if (text !== "") {
        db.ref('chat').push({
          name: name,
          text: text,
          time: Date.now()
        });
        msgInput.value = "";
      }
    }

    // تحديث الشات فورياً
    db.ref('chat').on('value', (snapshot) => {
      const messagesDiv = document.getElementById('messages');
      messagesDiv.innerHTML = "";
      snapshot.forEach((childSnapshot) => {
        const data = childSnapshot.val();
        messagesDiv.innerHTML += `
          <div class="msg-item">
            <span class="msg-name">${data.name}:</span>
            <span>${data.text}</span>
          </div>
        `;
      });
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });
  </script>

</body>
</html>
